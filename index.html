<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Jackpot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffd9e7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* MACHINE */
        .machine {
            position: relative;
            width: 420px;
        }

        .machine-bg {
            width: 100%;
            display: block;
        }

        /* REELS */
        .reels {
            position: absolute;
            top: 240px;
            left: 82px;

            width: 255px;

            display: flex;
            justify-content: space-between;
        }

        .reel {
            width: 70px;
            height: 130px;

            overflow: hidden;
            position: relative;
        }

        .reel-track {
            position: absolute;
            width: 100%;

            display: flex;
            flex-direction: column;
        }

        .reel-track img {
            width: 65px;
            height: 65px;

            object-fit: contain;

            margin: 10px auto;
        }

        /* BUTTON */
        button.spin-btn {
            position: absolute;

            bottom: 140px;
            left: 50%;

            transform: translateX(-50%);

            width: 110px;
            height: 110px;

            border-radius: 50%;
            border: none;

            background: transparent;

            cursor: pointer;
        }

        /* RESULT */
        .result {
            position: absolute;

            bottom: 55px;
            left: 50%;

            transform: translateX(-50%);

            min-width: 230px;

            padding: 14px 22px;

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, 0.95),
                    rgba(255, 240, 246, 0.95));

            border: 3px solid #ff4fa3;

            border-radius: 22px;

            text-align: center;

            font-size: 18px;
            font-weight: 700;

            color: #ff2d8d;

            line-height: 1.5;

            letter-spacing: 0.3px;

            box-shadow:
                0 10px 25px rgba(255, 45, 141, 0.22),
                inset 0 2px 6px rgba(255, 255, 255, 0.8);

            backdrop-filter: blur(8px);

            animation: floaty 2s ease-in-out infinite;
        }

        @keyframes floaty {

            0% {
                transform: translateX(-50%) translateY(0px);
            }

            50% {
                transform: translateX(-50%) translateY(-4px);
            }

            100% {
                transform: translateX(-50%) translateY(0px);
            }

        }

        /* POPUP */
        .popup {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            display: none;
            justify-content: center;
            align-items: center;

            z-index: 999;
        }

        .popup-box {
            width: 330px;

            background: white;

            border-radius: 32px;

            padding: 30px;

            text-align: center;

            animation: pop 0.3s ease;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .popup-emoji {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .popup-box h2 {
            color: #ff2d8d;
            margin-bottom: 12px;
            font-size: 30px;
        }

        .popup-box p {
            font-size: 19px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .popup-btn {
            border: none;

            padding: 14px 28px;

            background: linear-gradient(135deg,
                    #ff4fa3,
                    #ff7bc0);

            color: white;

            border-radius: 18px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 10px 20px rgba(255, 79, 163, 0.3);
        }

        @keyframes pop {

            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }
    </style>
</head>

<body>

    <div class="machine">

        <!-- MACHINE -->
        <img class="machine-bg" src="./assets/jackpot2.png">

        <!-- REELS -->
        <div class="reels">

            <!-- REEL 1 -->
            <div class="reel">
                <div class="reel-track" id="track1">

                    <img src="./assets/bear.png">
                    <img src="./assets/heart.png">
                    <img src="./assets/leave.png">
                    <img src="./assets/penguin.png">
                    <img src="./assets/balloon.png">

                    <img src="./assets/bear.png">
                    <img src="./assets/heart.png">
                    <img src="./assets/leave.png">
                    <img src="./assets/penguin.png">
                    <img src="./assets/balloon.png">

                </div>
            </div>

            <!-- REEL 2 -->
            <div class="reel">
                <div class="reel-track" id="track2">

                    <img src="./assets/bear.png">
                    <img src="./assets/heart.png">
                    <img src="./assets/leave.png">
                    <img src="./assets/penguin.png">
                    <img src="./assets/balloon.png">

                    <img src="./assets/bear.png">
                    <img src="./assets/heart.png">
                    <img src="./assets/leave.png">
                    <img src="./assets/penguin.png">
                    <img src="./assets/balloon.png">

                </div>
            </div>

            <!-- REEL 3 -->
            <div class="reel">
                <div class="reel-track" id="track3">

                    <img src="./assets/bear.png">
                    <img src="./assets/heart.png">
                    <img src="./assets/leave.png">
                    <img src="./assets/penguin.png">
                    <img src="./assets/balloon.png">

                    <img src="./assets/bear.png">
                    <img src="./assets/heart.png">
                    <img src="./assets/leave.png">
                    <img src="./assets/penguin.png">
                    <img src="./assets/balloon.png">

                </div>
            </div>

        </div>

        <!-- BUTTON -->
        <button class="spin-btn" onclick="spin()"></button>

        <!-- RESULT -->
        <div class="result" id="result">
            🎀 3 Cute Spins Left
        </div>

    </div>

    <!-- POPUP -->
    <div class="popup" id="popup">

        <div class="popup-box">

            <div class="popup-emoji" id="popupEmoji">
                🎉
            </div>

            <h2 id="popupTitle">
                JACKPOT!
            </h2>

            <p id="popupText">
                Reward
            </p>

            <button class="popup-btn" onclick="closePopup()">
                YAY 💖
            </button>

        </div>

    </div>

    <script>

        const symbols = [
            "./assets/bear.png",
            "./assets/heart.png",
            "./assets/leave.png",
            "./assets/penguin.png",
            "./assets/balloon.png"
        ];

        let spinning = false;
        let spinCount = 0;

        const maxSpins = 3;

        function spin() {

            if (spinning) return;

            // LIMIT
            if (spinCount >= maxSpins) {

                showPopup(
                    "😢",
                    "NO SPINS LEFT",
                    "You already used all 3 spins!"
                );

                return;
            }

            spinCount++;

            spinning = true;

            document.getElementById("result").innerHTML =
                `🎀 ${maxSpins - spinCount} Cute Spins Left`;

            const tracks = [
                document.getElementById("track1"),
                document.getElementById("track2"),
                document.getElementById("track3")
            ];

            const results = [];

            // Force win on 3rd spin if not won yet
            const forceWin = spinCount >= maxSpins;
            const forcedIndex = forceWin ? Math.floor(Math.random() * symbols.length) : null;

            tracks.forEach((track, index) => {

                // RESET
                track.style.transition = "none";
                track.style.transform = "translateY(0px)";

                track.offsetHeight;

                // RANDOM (or forced)
                const randomIndex = forceWin
                    ? forcedIndex
                    : Math.floor(Math.random() * symbols.length);

                results.push(symbols[randomIndex]);

                // SPIN
                track.style.transition =
                    `transform ${2 + index * 0.4}s cubic-bezier(.17,.67,.25,1)`;

                const finalPosition =
                    -(randomIndex * 85 + 425);

                track.style.transform =
                    `translateY(${finalPosition}px)`;

            });

            setTimeout(() => {

                checkReward(results);

                spinning = false;

            }, 3500);

        }

        function checkReward(results) {

            const resultBox =
                document.getElementById("result");

            // ALL MATCH
            if (
                results[0] === results[1] &&
                results[1] === results[2]
            ) {

                confettiEffect();

                // BEAR
                if (results[0].includes("bear")) {

                    resultBox.innerHTML =
                        "🐻 You Got Bear Match!";

                    showPopup(
                        "🎬",
                        "MOVIE NIGHT",
                        "You choose the movie tonight 🍿"
                    );

                }

                // PENGUIN
                else if (results[0].includes("penguin")) {

                    resultBox.innerHTML =
                        "🐧 Penguin Power!";

                    showPopup(
                        "🐍",
                        "SNAKE CHALLENGE",
                        "You choose the snake dare 😭"
                    );

                }

                // HEART
                else if (results[0].includes("heart")) {

                    resultBox.innerHTML =
                        "💖 Love Match!";

                    showPopup(
                        "💌",
                        "LOVE MESSAGE",
                        "Send a cute message right now 💖"
                    );

                }

                // LEAF
                else if (results[0].includes("leave")) {

                    spinCount--;

                    resultBox.innerHTML =
                        "🍀 Lucky Leaf!";

                    showPopup(
                        "🌿",
                        "EXTRA SPIN",
                        "OMG you unlocked 1 extra spin!"
                    );

                }

                // BALLOON
                else if (results[0].includes("balloon")) {

                    resultBox.innerHTML =
                        "🎈 Balloon Surprise!";

                    showPopup(
                        "🎁",
                        "SECRET GIFT",
                        "You unlocked a surprise gift!"
                    );

                }

            } else {

                resultBox.innerHTML =
                    `💖 Oopsie... Try Again`;

                showPopup(
                    "🥺",
                    "TRY AGAIN",
                    `${maxSpins - spinCount} spins left 🎀`
                );

            }

        }

        function showPopup(emoji, title, text) {

            document.getElementById("popupEmoji").innerHTML =
                emoji;

            document.getElementById("popupTitle").innerHTML =
                title;

            document.getElementById("popupText").innerHTML =
                text;

            document.getElementById("popup").style.display =
                "flex";

        }

        function closePopup() {

            document.getElementById("popup").style.display =
                "none";

        }

        function confettiEffect() {

            const duration = 2000;

            const end = Date.now() + duration;

            const colors = [
                '#ff2d8d',
                '#ffbf00',
                '#005eff'
            ];

            (function frame() {

                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });

                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {

                    requestAnimationFrame(frame);

                }

            })();

        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</body>

</html>
